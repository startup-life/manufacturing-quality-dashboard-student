<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>텀블러 공장 · 제조품질관리</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header" id="site-header">
    <div class="header-inner">
      <a class="brand" href="/" data-nav="home" aria-label="텀블러 공장 제조품질관리">
        <img class="brand-logo" src="/assets/tumble-factory-logo.png" alt="" width="36" height="36">
        <span class="brand-text"><strong>텀블러공장</strong><span class="brand-descriptor">제조품질관리</span></span>
      </a>
      <div class="header-actions" id="header-actions" hidden>
        <a href="/settings" data-path="/settings" id="nav-settings" class="nav-settings-link">설정</a>
        <span id="user-info" class="user-badge"></span>
        <button id="logout-btn" type="button" class="btn-logout">로그아웃</button>
        <button id="menu-toggle" class="menu-toggle" type="button" aria-label="메뉴 열기" aria-controls="mobile-nav-menu" aria-expanded="false">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </div>
    <div id="mobile-nav-menu" class="mobile-nav-menu" hidden>
      <a href="/settings" data-path="/settings">설정</a>
    </div>
  </header>

  <main id="main">
    <section id="session-loading" class="panel" role="status" aria-live="polite">
      <h1>텀블러 공장 제조품질관리</h1>
      <p>로그인 상태를 확인하는 중입니다. 화면은 먼저 준비하고 있습니다.</p>
    </section>
    <section class="panel auth-panel-wrap" id="auth-panel" hidden></section>

    <div id="content-container" hidden>
      <div class="notice global-notice">
        AI 분석 결과는 보조 자료이며 품질 담당자의 확인이 필요합니다. 최종 출하 승인은 현장 기준에 따라 별도로 진행하세요.
      </div>

      <!-- Screens: each one is filled in from step 8 on. -->
      <section id="home-panel" hidden></section>
      <section class="panel" id="register-panel" hidden></section>
      <section class="panel" id="detail" hidden></section>
      <section class="panel" id="settings-panel" hidden></section>

      <!-- Not Found Panel -->
      <section class="panel" id="not-found-panel" hidden>
        <div class="section-head"><h2 id="not-found-title">페이지를 찾을 수 없습니다</h2></div>
        <p id="not-found-message">요청하신 페이지 경로가 올바르지 않거나 검사 기록이 존재하지 않습니다. 경로를 다시 확인해 주세요.</p>
        <div class="row nav-back-row">
          <a href="/" class="btn-action">품질 현황(홈)으로 이동</a>
        </div>
      </section>
    </div>

    <footer>
      텀블러 공장 품질관리 시스템입니다. 품질 기록 정본은 Google Sheets에 안전하게 저장되며 담당자가 직접 검토합니다.
    </footer>
  </main>

  <script type="module" src="/app.js"></script>
  <script type="module" src="/auth.js"></script>
</body>
</html>
