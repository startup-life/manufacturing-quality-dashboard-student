<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>텀블러 공장 제조품질관리</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #19342d;
        background: #f2f6f3;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
      }

      .app-header {
        min-height: 76px;
        box-sizing: border-box;
        width: 100%;
        padding: 12px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        background: #fff;
        border-bottom: 1px solid #d8e3dc;
      }

      .brand-link,
      .header-actions,
      .header-actions nav {
        display: flex;
        align-items: center;
      }

      .brand-link {
        gap: 12px;
        color: inherit;
        font-size: 20px;
        font-weight: 750;
        text-decoration: none;
      }

      .brand-link img {
        width: 44px;
        height: 44px;
      }

      .header-actions {
        gap: 22px;
      }

      .header-actions nav {
        gap: 20px;
      }

      .header-actions a {
        color: #276447;
        font-weight: 650;
      }

      .header-user {
        color: #40584d;
        white-space: nowrap;
      }

      .logout-button {
        width: auto;
        margin: 0;
        padding: 9px 14px;
      }

      .logout-button:disabled {
        cursor: not-allowed;
      }

      [hidden] {
        display: none !important;
      }

      .yellow-notice {
        box-sizing: border-box;
        width: 100%;
        padding: 14px 32px;
        color: #624b0b;
        background: #fff3bf;
        border-bottom: 1px solid #ead98a;
        line-height: 1.5;
      }

      .page-content {
        flex: 1;
        width: 100%;
        box-sizing: border-box;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      .app-footer {
        padding: 18px 24px;
        color: #52665b;
        text-align: center;
        background: #fff;
        border-top: 1px solid #d8e3dc;
      }

      .login-box {
        width: min(100% - 40px, 420px);
        box-sizing: border-box;
        padding: 36px;
        border: 1px solid #d8e3dc;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 12px 34px rgb(25 52 45 / 8%);
      }

      h1 {
        margin: 0 0 28px;
        font-size: 28px;
        line-height: 1.35;
      }

      label {
        display: block;
        margin: 18px 0 8px;
        font-weight: 650;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #b9c9c0;
        border-radius: 9px;
        font: inherit;
      }

      input:focus {
        outline: 3px solid #b8d9c7;
        border-color: #39785a;
      }

      button {
        width: 100%;
        margin-top: 24px;
        padding: 14px;
        border: 0;
        border-radius: 9px;
        color: #fff;
        background: #276447;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .error-message {
        margin: 16px 0 0;
        color: #b42318;
        font-weight: 600;
      }

      #app-screen {
        width: min(100%, 920px);
        box-sizing: border-box;
        padding: 24px;
        border-radius: 14px;
        background: #fff;
      }

      #app-screen h1 { margin-bottom: 0; }

      #not-found-view p { margin: 0 0 18px; }

      #not-found-view a {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 8px;
        color: #fff;
        background: #276447;
        font-weight: 700;
        text-decoration: none;
      }

    </style>
  </head>
  <body>
    <header class="app-header">
      <a class="brand-link" href="/" data-link aria-label="텀블러 공장 제조품질관리 홈">
        <img src="/logo.svg" alt="" />
        <span>텀블러 공장 제조품질관리</span>
      </a>
      <div id="header-actions" class="header-actions" hidden>
        <nav aria-label="주요 메뉴">
          <a href="/settings" data-link>설정</a>
          <span id="header-user" class="header-user"></span>
        </nav>
        <button id="logout-button" class="logout-button" type="button">로그아웃</button>
      </div>
    </header>

    <aside id="yellow-notice" class="yellow-notice" hidden>
      AI 분석 결과는 보조 자료이며 품질 담당자의 확인이 필요합니다. 최종 출하 승인은 현장 기준에 따라 별도로 진행하세요.
    </aside>

    <div class="page-content">
      <main id="login-box" class="login-box">
        <h1>텀블러 공장 제조품질관리</h1>
        <form id="login-form">
          <label for="username">계정</label>
          <input id="username" name="username" value="writer" autocomplete="username" required />

          <label for="password">비밀번호</label>
          <input
            id="password"
            name="password"
            type="password"
            value="writer1234!"
            autocomplete="current-password"
            required
          />

          <button id="login-button" type="submit">로그인</button>
          <p id="login-error" class="error-message" role="alert" hidden></p>
        </form>
      </main>

      <main id="app-screen" hidden>
        <h1 id="screen-title">품질 현황</h1>
        <section id="not-found-view" hidden>
          <p>페이지를 찾을 수 없습니다</p>
          <a href="/" data-link>홈으로 가기</a>
        </section>
      </main>
    </div>

    <footer id="app-footer" class="app-footer" hidden>텀블러 공장 품질관리 시스템입니다.</footer>

    <script>
      const loginBox = document.querySelector('#login-box');
      const appScreen = document.querySelector('#app-screen');
      const loginForm = document.querySelector('#login-form');
      const loginButton = document.querySelector('#login-button');
      const logoutButton = document.querySelector('#logout-button');
      const loginError = document.querySelector('#login-error');
      const headerActions = document.querySelector('#header-actions');
      const headerUser = document.querySelector('#header-user');
      const yellowNotice = document.querySelector('#yellow-notice');
      const appFooter = document.querySelector('#app-footer');
      const screenTitle = document.querySelector('#screen-title');
      const notFoundView = document.querySelector('#not-found-view');
      const roleLabels = { writer: '작성자', reviewer: '검토자', 'factory-user': '품질관리' };

      function renderScreen() {
        const route = window.location.pathname;
        let title = '품질 현황';
        if (route === '/inspections/new') title = '검사 등록';
        else if (/^\/inspections\/[^/]+$/.test(route)) title = '검사 상세';
        else if (route === '/settings') title = '설정';
        else if (route !== '/') {
          screenTitle.hidden = true;
          notFoundView.hidden = false;
          return;
        }
        screenTitle.textContent = title;
        screenTitle.hidden = false;
        notFoundView.hidden = true;
      }

      function showApp(user) {
        loginBox.hidden = true;
        appScreen.hidden = false;
        headerActions.hidden = false;
        yellowNotice.hidden = false;
        appFooter.hidden = false;
        headerUser.textContent = `${user.username} (${roleLabels[user.role] || user.role})`;
        renderScreen();
      }

      function navigate(path) {
        if (window.location.pathname !== path) history.pushState({}, '', path);
        renderScreen();
      }

      function showLoginError(message) {
        loginError.textContent = message;
        loginError.hidden = false;
      }

      async function checkLogin() {
        try {
          const response = await fetch('/api/session');
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || '로그인 상태를 확인하지 못했습니다.');
          }
          if (result.user) showApp(result.user);
        } catch (error) {
          showLoginError(error.message || '로그인 상태를 확인하지 못했습니다.');
        }
      }

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        loginError.hidden = true;
        loginButton.disabled = true;

        const formData = new FormData(loginForm);
        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: formData.get('username'),
              password: formData.get('password'),
            }),
          });
          const result = await response.json();
          if (!response.ok || result.error) {
            showLoginError(result.error || '로그인 정보를 확인하세요.');
            return;
          }
          showApp(result.user);
        } catch (error) {
          showLoginError(error.message || '서버와 통신할 수 없습니다.');
        } finally {
          loginButton.disabled = false;
        }
      });

      document.addEventListener('click', (event) => {
        const link = event.target.closest('a[data-link]');
        if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        navigate(link.getAttribute('href'));
      });

      logoutButton.addEventListener('click', async () => {
        logoutButton.disabled = true;
        try {
          const response = await fetch('/api/logout', { method: 'POST' });
          const result = await response.json();
          if (!response.ok || result.error) {
            throw new Error(result.error || '로그아웃하지 못했습니다.');
          }

          loginForm.reset();
          loginError.textContent = '';
          loginError.hidden = true;
          headerUser.textContent = '';
          headerActions.hidden = true;
          yellowNotice.hidden = true;
          appFooter.hidden = true;
          appScreen.hidden = true;
          loginBox.hidden = false;
        } catch (error) {
          showLoginError(error.message || '로그아웃하지 못했습니다.');
          loginBox.hidden = false;
        } finally {
          logoutButton.disabled = false;
        }
      });

      window.addEventListener('popstate', renderScreen);

      checkLogin();
    </script>
  </body>
</html>
